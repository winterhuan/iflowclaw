[project]
name = "iflowclaw"
version = "1.0.0"
description = "Python-first lightweight personal AI assistant with Feishu channel and multi-backend agent support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.40.0",
  "croniter>=6.0.0",
  "httpx>=0.27.0",
  "iflow-cli-sdk>=0.2.1",
  "lark-oapi>=1.4.14b1",
  "mcp>=1.0.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
iflowclaw = "iflowclaw.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["iflowclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["."]

