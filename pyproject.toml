[project]
name = "iflowclaw"
version = "1.0.0"
description = "Lightweight personal AI assistant with Feishu channel and multi-backend agent support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "croniter>=6.0.0",
  "httpx>=0.27.0",
  "lark-oapi>=1.4.14b1",
  "mcp>=1.0.0",
  "openai>=1.0.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
iflow = [
  "iflow-cli-sdk>=0.2.1",
]
claude = [
  "claude-agent-sdk>=0.1.0",
]
agno = [
  "agno>=2.0.0",
]
all = [
  "iflow-cli-sdk>=0.2.1",
  "claude-agent-sdk>=0.1.0",
  "agno>=2.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[project.scripts]
iflowclaw = "iflowclaw.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_integration"]
asyncio_mode = "auto"
cache_dir = ".tmp_test/.pytest_cache"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
